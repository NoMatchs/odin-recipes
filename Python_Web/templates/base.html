<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Python Web框架实战{% endblock %}</title>
    
    <!-- Font Awesome 图标库（CDN） -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Font 字体 -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        /* ========== 全局重置 ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        /* ========== 主容器 - 毛玻璃效果 ========== */
        .container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 32px;
            padding: 50px;
            max-width: 900px;
            width: 100%;
            box-shadow: 
                0 25px 80px rgba(0,0,0,0.25),
                0 0 0 1px rgba(255,255,255,0.1) inset;
            animation: fadeInUp 0.6s ease-out;
        }
        
        /* ========== 入场动画 ========== */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        /* ========== 导航栏 ========== */
        .nav {
            display: flex;
            gap: 8px;
            margin-bottom: 35px;
            flex-wrap: wrap;
            padding-bottom: 25px;
            border-bottom: 2px solid rgba(102, 126, 234, 0.15);
        }
        
        .nav a {
            color: #4a5568;
            text-decoration: none;
            font-weight: 500;
            font-size: 0.95rem;
            padding: 10px 20px;
            border-radius: 12px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        
        .nav a i {
            font-size: 1rem;
        }
        
        .nav a:hover {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.35);
        }
        
        .nav a.active {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }
        
        /* ========== 内容区域 ========== */
        .content {
            color: #2d3748;
            line-height: 1.8;
            min-height: 300px;
        }
        
        .content h1 {
            font-size: 2.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 16px;
            letter-spacing: -0.02em;
        }
        
        .content h1 .emoji {
            -webkit-text-fill-color: initial;
        }
        
        .content p {
            color: #4a5568;
            font-size: 1.1rem;
            margin-bottom: 16px;
        }
        
        .content .subtitle {
            font-size: 1.2rem;
            color: #667eea;
            font-weight: 500;
            margin-bottom: 24px;
        }
        
        /* ========== 卡片组件 ========== */
        .card {
            background: white;
            border-radius: 16px;
            padding: 24px 28px;
            margin: 18px 0;
            border-left: 4px solid #667eea;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
            transition: all 0.3s ease;
        }
        
        .card:hover {
            box-shadow: 0 8px 30px rgba(0,0,0,0.1);
            transform: translateX(4px);
        }
        
        .card h3 {
            color: #2d3748;
            font-size: 1.15rem;
            font-weight: 600;
            margin-bottom: 10px;
        }
        
        .card ul {
            list-style: none;
            padding: 0;
        }
        
        .card ul li {
            padding: 8px 0;
            border-bottom: 1px solid #f7fafc;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .card ul li:last-child {
            border-bottom: none;
        }
        
        .card ul li::before {
            content: "▸";
            color: #667eea;
            font-weight: bold;
        }
        
        /* ========== 按钮 ========== */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 14px 32px;
            border-radius: 14px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
            border: none;
            cursor: pointer;
        }
        
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 35px rgba(102, 126, 234, 0.4);
        }
        
        .btn:active {
            transform: translateY(0px);
        }
        
        .btn i {
            font-size: 1.1rem;
        }
        
        /* ========== 网格布局 ========== */
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin: 24px 0;
        }
        
        .grid-2 .btn {
            justify-content: center;
            text-align: center;
        }
        
        /* ========== 用户卡片（渐变） ========== */
        .user-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px 35px;
            border-radius: 20px;
            margin: 20px 0;
            box-shadow: 0 10px 40px rgba(102, 126, 234, 0.3);
            transition: all 0.3s ease;
        }
        
        .user-card:hover {
            transform: scale(1.02);
            box-shadow: 0 15px 50px rgba(102, 126, 234, 0.4);
        }
        
        .user-card h2 {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 8px;
        }
        
        .user-card .info {
            opacity: 0.92;
            font-size: 1.05rem;
        }
        
        .user-card .info p {
            color: rgba(255,255,255,0.95);
            padding: 4px 0;
        }
        
        .user-card .info i {
            margin-right: 10px;
            width: 20px;
        }
        
        /* ========== 标签 ========== */
        .badge {
            display: inline-block;
            background: rgba(102, 126, 234, 0.12);
            color: #667eea;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
        }
        
        /* ========== 页脚 ========== */
        .footer {
            margin-top: 35px;
            padding-top: 25px;
            border-top: 2px solid rgba(102, 126, 234, 0.12);
            text-align: center;
            color: #a0aec0;
            font-size: 0.9rem;
        }
        
        .footer i {
            color: #f5576c;
            margin: 0 4px;
        }
        
        /* ========== 响应式设计 ========== */
        @media (max-width: 768px) {
            .container {
                padding: 28px 20px;
                border-radius: 24px;
            }
            
            .content h1 {
                font-size: 2rem;
            }
            
            .grid-2 {
                grid-template-columns: 1fr;
            }
            
            .nav a {
                font-size: 0.85rem;
                padding: 8px 14px;
            }
            
            .user-card {
                padding: 22px 24px;
            }
        }
        
        @media (max-width: 480px) {
            .container {
                padding: 20px 16px;
                border-radius: 18px;
            }
            
            .content h1 {
                font-size: 1.6rem;
            }
            
            .btn {
                padding: 12px 20px;
                font-size: 0.9rem;
            }
        }
        
        /* ========== 滚动条美化 ========== */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f7fafc;
        }
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 导航栏 -->
        <nav class="nav">
            <a href="/" {% if request_path == '/' %}class="active"{% endif %}>
                <i class="fas fa-home"></i> 首页
            </a>
            <a href="/about" {% if request_path == '/about' %}class="active"{% endif %}>
                <i class="fas fa-info-circle"></i> 关于
            </a>
            <a href="/features" {% if request_path == '/features' %}class="active"{% endif %}>
                <i class="fas fa-star"></i> 特性
            </a>
        </nav>
        
        <!-- 页面内容 -->
        <div class="content">
            {% block content %}{% endblock %}
        </div>
        
        <!-- 页脚 -->
        <div class="footer">
            <i class="fas fa-code"></i> 用 <i class="fas fa-heart"></i> 构建 
            <span style="color:#667eea;font-weight:500;">Python Web 框架</span> 
            | 运行在 localhost:8000
        </div>
    </div>
</body>
</html>
