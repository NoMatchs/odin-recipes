{% extends "base.html" %}

{% block title %}首页 - Python Web框架实战{% endblock %}

{% block content %}
<div style="text-align: center; margin-bottom: 10px;">
    <div style="font-size: 4rem; margin-bottom: 8px;">🚀</div>
    <h1>Python Web 框架<span style="background: linear-gradient(135deg, #f093fb, #f5576c); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;">原理实战</span></h1>
    <p class="subtitle" style="-webkit-text-fill-color: #667eea;">
        <i class="fas fa-cogs"></i> 从零实现 · 深入理解 · 亲手构建
    </p>
</div>

<div class="card">
    <h3><i class="fas fa-check-circle" style="color:#667eea;"></i> 已实现的核心功能</h3>
    <ul>
        <li><i class="fas fa-route" style="color:#667eea;"></i> 动态路由系统（支持URL参数提取）</li>
        <li><i class="fas fa-layer-group" style="color:#764ba2;"></i> 模板引擎（继承 + 变量替换）</li>
        <li><i class="fas fa-paint-brush" style="color:#f093fb;"></i> 现代化UI设计（毛玻璃 + 渐变色）</li>
        <li><i class="fas fa-mobile-alt" style="color:#4ecdc4;"></i> 响应式布局（适配所有设备）</li>
    </ul>
</div>

<div class="grid-2">
    <a href="/hello/张三" class="btn">
        <i class="fas fa-hand-wave"></i> 动态问候
    </a>
    <a href="/user/123" class="btn">
        <i class="fas fa-user"></i> 用户信息
    </a>
    <a href="/post/2026/09" class="btn">
        <i class="fas fa-newspaper"></i> 文章列表
    </a>
    <a href="/calc/10/20" class="btn">
        <i class="fas fa-calculator"></i> 计算器
    </a>
</div>

<div style="text-align: center; margin-top: 16px;">
    <span class="badge"><i class="fas fa-check"></i> 纯Python实现</span>
    <span class="badge" style="background:rgba(118,75,162,0.12);color:#764ba2;"><i class="fas fa-bolt"></i> 零依赖</span>
    <span class="badge" style="background:rgba(244,87,108,0.12);color:#f5576c;"><i class="fas fa-heart"></i> 开源</span>
</div>
{% endblock %}
