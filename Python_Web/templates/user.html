{% extends "base.html" %}

{% block title %}用户信息 - {{ user.name }}{% endblock %}

{% block content %}
<div style="display: flex; align-items: center; gap: 12px; margin-bottom: 10px;">
    <span style="font-size: 2.8rem;">👤</span>
    <h1 style="margin-bottom: 0;">用户信息</h1>
</div>

<div class="user-card">
    <div style="display: flex; align-items: center; gap: 16px; flex-wrap: wrap;">
        <div style="font-size: 3.5rem; background: rgba(255,255,255,0.2); border-radius: 50%; width: 80px; height: 80px; display: flex; align-items: center; justify-content: center;">
            {{ user.name[0] }}
        </div>
        <div>
            <h2>{{ user.name }}</h2>
            <div class="info">
                <p><i class="fas fa-id-card"></i> ID：{{ user_id }}</p>
                <p><i class="fas fa-birthday-cake"></i> 年龄：{{ user.age }} 岁</p>
                <p><i class="fas fa-graduation-cap"></i> 专业：{{ user.major }}</p>
            </div>
        </div>
    </div>
</div>

<div style="display: flex; gap: 12px; flex-wrap: wrap; margin-top: 8px;">
    <a href="/" class="btn"><i class="fas fa-arrow-left"></i> 返回首页</a>
    <a href="/user/456" class="btn" style="background: linear-gradient(135deg, #f093fb, #f5576c);">
        <i class="fas fa-user-friends"></i> 查看李四
    </a>
    <a href="/user/789" class="btn" style="background: linear-gradient(135deg, #4ecdc4, #44a08d);">
        <i class="fas fa-user-friends"></i> 查看王五
    </a>
</div>
{% endblock %}
