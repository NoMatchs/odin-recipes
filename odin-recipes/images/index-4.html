<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>💕 我们的3D相册 · 批量导入</title>
    <meta name="description" content="专属我们的3D照片球体，支持批量导入整个文件夹">
    <meta name="theme-color" content="#1a0a2e">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Georgia', 'PingFang SC', 'Microsoft YaHei', serif;
            background: #0a0a20;
            overflow: hidden;
            color: white;
            height: 100vh;
        }

        #header {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            z-index: 50;
            padding: 20px 28px;
            background: linear-gradient(180deg, rgba(0,0,0,0.7) 0%, transparent 100%);
            pointer-events: none;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }
        #header .site-title {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #f093fb, #f5576c, #ffecd2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        #header .site-subtitle {
            font-size: 14px;
            color: rgba(255,255,255,0.5);
            margin-top: 4px;
            font-style: italic;
            -webkit-text-fill-color: rgba(255,255,255,0.5);
            letter-spacing: 3px;
        }
        #header .header-right {
            pointer-events: auto;
            display: flex;
            gap: 14px;
            align-items: center;
        }
        #header .header-right .stats {
            font-size: 13px;
            color: rgba(255,255,255,0.4);
            background: rgba(255,255,255,0.05);
            padding: 4px 16px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.05);
            backdrop-filter: blur(4px);
        }
        #header .header-right .stats strong {
            color: #f5576c;
            font-weight: 700;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }

        #footer {
            position: absolute;
            bottom: 24px;
            left: 0;
            width: 100%;
            text-align: center;
            color: rgba(255, 255, 255, 0.2);
            font-size: 13px;
            pointer-events: none;
            z-index: 10;
            text-shadow: 0 0 30px rgba(0,0,0,0.9);
            letter-spacing: 2px;
            font-style: italic;
        }
        #footer .heart {
            color: #f5576c;
            display: inline-block;
            animation: heartbeat 1.4s ease-in-out infinite;
        }
        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            14% { transform: scale(1.2); }
            28% { transform: scale(1); }
            42% { transform: scale(1.15); }
            70% { transform: scale(1); }
        }

        /* ===== 控制栏 - 新增文件夹导入 ===== */
        #controls {
            position: absolute;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            display: flex;
            gap: 10px;
            align-items: center;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 10px 20px;
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 8px 40px rgba(0,0,0,0.5);
            flex-wrap: wrap;
            justify-content: center;
            pointer-events: auto;
        }
        #controls label {
            cursor: pointer;
            padding: 7px 18px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
            letter-spacing: 0.5px;
            color: white;
        }
        #controls label:hover {
            transform: scale(1.05);
        }
        #controls label.primary {
            background: linear-gradient(135deg, #f093fb, #f5576c);
        }
        #controls label.primary:hover {
            box-shadow: 0 4px 24px rgba(245, 87, 108, 0.4);
        }
        #controls label.secondary {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        #controls label.secondary:hover {
            background: rgba(255, 255, 255, 0.15);
        }
        #controls input[type="file"] {
            display: none;
        }
        #controls button {
            padding: 7px 18px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 30px;
            color: rgba(255,255,255,0.6);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            white-space: nowrap;
            letter-spacing: 0.3px;
        }
        #controls button:hover {
            background: rgba(255, 255, 255, 0.12);
            color: white;
        }
        #controls .divider {
            width: 1px;
            height: 24px;
            background: rgba(255,255,255,0.06);
        }

        /* ===== 拖拽高亮 ===== */
        #drop-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(245, 87, 108, 0.08);
            backdrop-filter: blur(4px);
            z-index: 200;
            display: none;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            border: 4px dashed rgba(245, 87, 108, 0.3);
            box-sizing: border-box;
        }
        #drop-overlay.active {
            display: flex;
        }
        #drop-overlay .drop-text {
            font-size: 32px;
            color: rgba(255,255,255,0.6);
            background: rgba(0,0,0,0.5);
            padding: 30px 50px;
            border-radius: 20px;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.1);
            text-align: center;
        }
        #drop-overlay .drop-text .icon {
            font-size: 60px;
            display: block;
            margin-bottom: 12px;
        }

        /* ===== 加载提示 ===== */
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 16px;
            background: rgba(0, 0, 0, 0.7);
            padding: 16px 32px;
            border-radius: 40px;
            z-index: 50;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.05);
            display: none;
            text-align: center;
            pointer-events: none;
        }
        #loading .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2.5px solid rgba(255,255,255,0.1);
            border-top: 2.5px solid #f5576c;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            margin-right: 12px;
            vertical-align: middle;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* ===== 模态框 ===== */
        #modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.93);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            z-index: 999;
            display: none;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            animation: fadeIn 0.3s ease;
        }
        #modal.active {
            display: flex;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.96); }
            to { opacity: 1; transform: scale(1); }
        }
        #modal img {
            max-width: 88vw;
            max-height: 80vh;
            object-fit: contain;
            border-radius: 12px;
            box-shadow: 0 30px 100px rgba(0,0,0,0.9);
            border: 2px solid rgba(255,255,255,0.04);
            user-select: none;
            -webkit-user-drag: none;
        }
        #modal .close-hint {
            position: absolute;
            bottom: 32px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.2);
            font-size: 13px;
            letter-spacing: 2px;
            background: rgba(255,255,255,0.02);
            padding: 6px 20px;
            border-radius: 30px;
            border: 1px solid rgba(255,255,255,0.03);
            pointer-events: none;
        }
        #modal .close-btn {
            position: absolute;
            top: 20px;
            right: 28px;
            font-size: 28px;
            color: rgba(255,255,255,0.25);
            cursor: pointer;
            transition: all 0.3s;
            background: none;
            border: none;
            padding: 4px 12px;
            line-height: 1;
        }
        #modal .close-btn:hover {
            color: white;
            transform: rotate(90deg);
        }
        #modal .counter {
            position: absolute;
            top: 24px;
            left: 28px;
            color: rgba(255,255,255,0.25);
            font-size: 14px;
            background: rgba(0,0,0,0.3);
            padding: 4px 16px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.03);
            pointer-events: none;
            letter-spacing: 1px;
        }
        #modal .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.04);
            color: rgba(255,255,255,0.2);
            font-size: 34px;
            padding: 18px 12px;
            cursor: pointer;
            transition: all 0.3s;
            border-radius: 8px;
            user-select: none;
            line-height: 1;
        }
        #modal .nav-btn:hover {
            background: rgba(255,255,255,0.06);
            color: white;
        }
        #modal .nav-btn.prev { left: 16px; }
        #modal .nav-btn.next { right: 16px; }

        @media (max-width: 768px) {
            #header .site-title { font-size: 20px; }
            #header .site-subtitle { font-size: 12px; }
            #header { padding: 14px 18px; }
            #header .header-right .stats { font-size: 11px; padding: 2px 12px; }
            #controls { bottom: 70px; padding: 8px 14px; gap: 6px; width: 95%; }
            #controls label, #controls button { font-size: 12px; padding: 5px 14px; }
            #footer { font-size: 11px; bottom: 16px; }
            #modal .nav-btn { padding: 12px 8px; font-size: 26px; }
            #modal .nav-btn.prev { left: 6px; }
            #modal .nav-btn.next { right: 6px; }
            #modal .close-btn { top: 12px; right: 16px; font-size: 22px; }
            #modal .counter { top: 14px; left: 16px; font-size: 12px; }
            #modal .close-hint { bottom: 16px; font-size: 11px; padding: 4px 14px; }
            #drop-overlay .drop-text { font-size: 22px; padding: 20px 30px; }
            #drop-overlay .drop-text .icon { font-size: 40px; }
        }
        @media (max-width: 480px) {
            #header .site-title { font-size: 17px; }
            #header .site-subtitle { font-size: 10px; letter-spacing: 1px; }
            #controls { bottom: 60px; padding: 6px 10px; gap: 4px; }
            #controls label, #controls button { font-size: 11px; padding: 4px 12px; }
        }
    </style>
</head>
<body>

    <header id="header">
        <div>
            <div class="site-title">💕 我们的3D相册</div>
            <div class="site-subtitle">— 每一张照片，都是我想你的瞬间 —</div>
        </div>
        <div class="header-right">
            <span class="stats">📷 <strong id="countDisplay">0</strong> 张回忆</span>
        </div>
    </header>

    <div id="loading">
        <span class="spinner"></span> 加载我们的照片中...
    </div>

    <div id="canvas-container"></div>

    <!-- ===== 拖拽提示浮层 ===== -->
    <div id="drop-overlay">
        <div class="drop-text">
            <span class="icon">📂</span>
            释放鼠标 · 导入整个文件夹
        </div>
    </div>

    <!-- ===== 控制栏 ===== -->
    <div id="controls">
        <!-- 导入文件夹 (Chrome 支持) -->
        <label class="primary" for="folderInput">📂 导入文件夹</label>
        <input type="file" id="folderInput" webkitdirectory directory multiple accept="image/*">

        <!-- 选择多张图片 -->
        <label class="secondary" for="fileInput">🖼️ 选择图片</label>
        <input type="file" id="fileInput" accept="image/*" multiple>

        <span class="divider"></span>

        <button id="resetBtn" style="color:rgba(255,255,255,0.4);">🗑️ 清空</button>
        <span class="divider"></span>
        <button id="autoRotateBtn">⏸️ 暂停</button>
    </div>

    <footer id="footer">
        <span>🖱️ 拖动旋转 · 滚轮缩放 · 点击照片放大</span>
        <span style="margin: 0 8px; opacity:0.15;">|</span>
        <span>Made with <span class="heart">❤</span> for you</span>
    </footer>

    <!-- ===== 模态框 ===== -->
    <div id="modal">
        <button class="close-btn" id="modalClose">✕</button>
        <span class="counter" id="modalCounter">1 / 0</span>
        <button class="nav-btn prev" id="modalPrev">‹</button>
        <button class="nav-btn next" id="modalNext">›</button>
        <img id="modalImage" src="" alt="我们的回忆">
        <div class="close-hint">点击背景关闭 · 键盘 ← → 切换</div>
    </div>

    <!-- ===== Three.js ===== -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --- DOM 引用 ---
        const container = document.getElementById('canvas-container');
        const fileInput = document.getElementById('fileInput');
        const folderInput = document.getElementById('folderInput');
        const resetBtn = document.getElementById('resetBtn');
        const autoRotateBtn = document.getElementById('autoRotateBtn');
        const countDisplay = document.getElementById('countDisplay');
        const loadingEl = document.getElementById('loading');
        const dropOverlay = document.getElementById('drop-overlay');

        // 模态框
        const modal = document.getElementById('modal');
        const modalImage = document.getElementById('modalImage');
        const modalCounter = document.getElementById('modalCounter');
        const modalClose = document.getElementById('modalClose');
        const modalPrev = document.getElementById('modalPrev');
        const modalNext = document.getElementById('modalNext');

        // --- Three.js 初始化 ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a20);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 8);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.06;
        controls.rotateSpeed = 0.7;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 1.5;
        controls.target.set(0, 0, 0);
        controls.update();

        // --- 灯光 ---
        const ambient = new THREE.AmbientLight(0x404060);
        scene.add(ambient);
        const light = new THREE.PointLight(0xff99aa, 0.5);
        light.position.set(10, 10, 10);
        scene.add(light);
        const light2 = new THREE.PointLight(0x8888ff, 0.3);
        light2.position.set(-10, -5, 5);
        scene.add(light2);

        // --- 星空 ---
        function addStars() {
            const vertices = [];
            const colors = [];
            for (let i = 0; i < 2500; i++) {
                vertices.push(
                    (Math.random() - 0.5) * 250,
                    (Math.random() - 0.5) * 250,
                    (Math.random() - 0.5) * 250 - 40
                );
                const r = 0.7 + Math.random() * 0.3;
                const g = 0.4 + Math.random() * 0.4;
                const b = 0.8 + Math.random() * 0.2;
                colors.push(r, g, b);
            }
            const geom = new THREE.BufferGeometry();
            geom.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
            geom.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
            const mat = new THREE.PointsMaterial({
                size: 0.15,
                transparent: true,
                opacity: 0.6,
                blending: THREE.AdditiveBlending,
                vertexColors: true,
            });
            const stars = new THREE.Points(geom, mat);
            scene.add(stars);
            return stars;
        }
        addStars();

        // --- 辅助环 ---
        function addRings() {
            const ringMat = new THREE.MeshBasicMaterial({
                color: 0xff88aa,
                transparent: true,
                opacity: 0.05,
                wireframe: false,
            });
            const ringGeo = new THREE.TorusGeometry(3.6, 0.015, 16, 120);
            const ring1 = new THREE.Mesh(ringGeo, ringMat);
            ring1.rotation.x = Math.PI / 2;
            scene.add(ring1);
            const ring2 = new THREE.Mesh(ringGeo, ringMat);
            ring2.rotation.y = Math.PI / 2;
            scene.add(ring2);
            const ring3 = new THREE.Mesh(ringGeo, ringMat);
            ring3.rotation.z = Math.PI / 2;
            scene.add(ring3);
        }
        addRings();

        // --- 图片数据 ---
        const imageGroup = new THREE.Group();
        scene.add(imageGroup);

        let allImageUrls = []; // 所有图片 URL
        let spriteList = [];
        let isAutoRotate = true;

        // --- 预设照片 (可选) ---
        const PRESET_IMAGES = [
            // 如果有预设照片，在这里填写路径
            // './images/photo1.jpg',
        ];

        // --- 构建球体 ---
        function buildSphere(urls) {
            // 清空
            while (imageGroup.children.length > 0) {
                const child = imageGroup.children[0];
                if (child.material) {
                    if (child.material.map) child.material.map.dispose();
                    child.material.dispose();
                }
                imageGroup.remove(child);
            }
            spriteList = [];

            if (urls.length === 0) {
                countDisplay.textContent = '0';
                loadingEl.style.display = 'none';
                return;
            }

            const count = urls.length;
            countDisplay.textContent = count;
            loadingEl.style.display = 'block';

            const radius = Math.max(2.5, Math.min(4.8, 1.0 + count * 0.028));
            const size = Math.max(0.25, Math.min(0.75, 0.85 - count * 0.004));

            function fibonacciSphere(samples, r) {
                const points = [];
                const phi = Math.PI * (3 - Math.sqrt(5));
                for (let i = 0; i < samples; i++) {
                    const y = 1 - (i / (samples - 1)) * 2;
                    const radiusAtY = Math.sqrt(1 - y * y);
                    const theta = phi * i;
                    points.push(new THREE.Vector3(
                        Math.cos(theta) * radiusAtY * r,
                        y * r,
                        Math.sin(theta) * radiusAtY * r
                    ));
                }
                return points;
            }

            const positions = fibonacciSphere(count, radius);
            const loader = new THREE.TextureLoader();
            let loaded = 0;

            urls.forEach((url, index) => {
                const material = new THREE.SpriteMaterial({
                    map: loader.load(url, 
                        () => {
                            loaded++;
                            if (loaded >= count) loadingEl.style.display = 'none';
                        },
                        undefined,
                        () => {
                            material.color.setHex(0xf5576c);
                            loaded++;
                            if (loaded >= count) loadingEl.style.display = 'none';
                        }
                    ),
                    transparent: true,
                    depthTest: true,
                    depthWrite: false,
                });

                const sprite = new THREE.Sprite(material);
                sprite.position.copy(positions[index]);
                sprite.scale.set(size, size, 1);
                sprite.userData = { url, index };
                imageGroup.add(sprite);
                spriteList.push(sprite);
            });

            if (loaded >= count) loadingEl.style.display = 'none';
        }

        // --- 加载所有图片 (预设 + 用户上传) ---
        function loadAllImages() {
            const allUrls = [...PRESET_IMAGES, ...allImageUrls];
            buildSphere(allUrls);
        }

        // --- 批量处理文件 (支持文件夹 + 多选) ---
        function processFiles(files) {
            const validFiles = [];
            for (const file of files) {
                if (file.type.startsWith('image/')) {
                    validFiles.push(file);
                }
            }

            if (validFiles.length === 0) {
                alert('未找到图片文件，请选择包含图片的文件夹');
                return;
            }

            if (validFiles.length > 500) {
                alert(`检测到 ${validFiles.length} 张图片，数量较多，可能影响性能。建议分批导入。`);
                // 仍然继续，但给出警告
            }

            const urls = validFiles.map(f => URL.createObjectURL(f));
            // 合并到已有列表
            allImageUrls = [...allImageUrls, ...urls];
            loadAllImages();
            
            // 清空 input 以便重复选择同一文件夹
            folderInput.value = '';
            fileInput.value = '';
        }

        // --- 清空 (只清空用户上传的) ---
        function resetAll() {
            allImageUrls.forEach(url => URL.revokeObjectURL(url));
            allImageUrls = [];
            loadAllImages();
            folderInput.value = '';
            fileInput.value = '';
            closeModal();
        }

        // --- 自动旋转控制 ---
        function toggleAutoRotate() {
            isAutoRotate = !isAutoRotate;
            controls.autoRotate = isAutoRotate;
            autoRotateBtn.textContent = isAutoRotate ? '⏸️ 暂停' : '▶️ 旋转';
        }
        autoRotateBtn.addEventListener('click', toggleAutoRotate);

        // --- 模态框 ---
        let currentIndex = 0;

        function getAllSprites() { return spriteList; }

        function openModal(index) {
            const sprites = getAllSprites();
            if (sprites.length === 0 || index < 0 || index >= sprites.length) return;
            currentIndex = index;
            modalImage.src = sprites[index].userData.url;
            modalCounter.textContent = `${index + 1} / ${sprites.length}`;
            modal.classList.add('active');
            controls.autoRotate = false;
            autoRotateBtn.textContent = '▶️ 旋转';
            isAutoRotate = false;
        }

        function closeModal() {
            modal.classList.remove('active');
            if (isAutoRotate) {
                controls.autoRotate = true;
                autoRotateBtn.textContent = '⏸️ 暂停';
            }
        }

        function prevImage() {
            const sprites = getAllSprites();
            if (sprites.length === 0) return;
            currentIndex = (currentIndex - 1 + sprites.length) % sprites.length;
            openModal(currentIndex);
        }

        function nextImage() {
            const sprites = getAllSprites();
            if (sprites.length === 0) return;
            currentIndex = (currentIndex + 1) % sprites.length;
            openModal(currentIndex);
        }

        // --- 点击检测 ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        function onCanvasClick(event) {
            const rect = renderer.domElement.getBoundingClientRect();
            mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(getAllSprites());

            if (intersects.length > 0) {
                const clicked = intersects[0].object;
                if (clicked.userData && clicked.userData.index !== undefined) {
                    openModal(clicked.userData.index);
                }
            }
        }
        renderer.domElement.addEventListener('click', onCanvasClick);

        // --- 模态框事件 ---
        modalClose.addEventListener('click', closeModal);
        modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });
        modalPrev.addEventListener('click', (e) => { e.stopPropagation(); prevImage(); });
        modalNext.addEventListener('click', (e) => { e.stopPropagation(); nextImage(); });

        document.addEventListener('keydown', (e) => {
            if (!modal.classList.contains('active')) return;
            if (e.key === 'Escape') closeModal();
            if (e.key === 'ArrowLeft') prevImage();
            if (e.key === 'ArrowRight') nextImage();
        });

        // --- 事件绑定 ---
        // 导入文件夹
        folderInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                processFiles(e.target.files);
            }
        });

        // 选择图片
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                processFiles(e.target.files);
            }
        });

        resetBtn.addEventListener('click', resetAll);

        // --- 拖拽支持 (文件夹 + 文件) ---
        let dragCounter = 0;

        document.addEventListener('dragenter', (e) => {
            e.preventDefault();
            dragCounter++;
            if (dragCounter === 1) {
                dropOverlay.classList.add('active');
            }
        });

        document.addEventListener('dragleave', (e) => {
            e.preventDefault();
            dragCounter--;
            if (dragCounter === 0) {
                dropOverlay.classList.remove('active');
            }
        });

        document.addEventListener('dragover', (e) => {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'copy';
        });

        document.addEventListener('drop', (e) => {
            e.preventDefault();
            dragCounter = 0;
            dropOverlay.classList.remove('active');
            
            if (e.dataTransfer.files.length > 0) {
                processFiles(e.dataTransfer.files);
            }
        });

        // --- 窗口自适应 ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- 渲染 ---
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // --- 启动 ---
        loadAllImages();

        console.log('💕 我们的3D相册已启动！');
        console.log('📂 支持导入整个文件夹 (拖拽或点击按钮)');
        console.log('🖼️ 也支持多选图片');
        console.log('🖱️ 点击任意照片可放大查看');
    </script>
</body>
</html>
